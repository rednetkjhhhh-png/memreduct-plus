name: Build Mem Reduct Plus

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/pc-optimizer-v1

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Check out Mem Reduct Plus
        uses: actions/checkout@v4
        with:
          path: memreduct-plus

      - name: Check out routine dependency
        uses: actions/checkout@v4
        with:
          repository: henrypp/routine
          ref: ff8f811b6520bc0b60754244660f39f6f3007497
          path: routine

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build original Mem Reduct Release x64
        run: >-
          msbuild memreduct-plus\memreduct.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Build PC Optimizer dashboard x64
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist memreduct-plus\bin\amd64 mkdir memreduct-plus\bin\amd64
          cl /nologo /O2 /W3 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /Fe:memreduct-plus\bin\amd64\MemReductPlus.exe memreduct-plus\optimizer\pc_optimizer.c /link /SUBSYSTEM:WINDOWS comctl32.lib psapi.lib powrprof.lib shell32.lib advapi32.lib user32.lib gdi32.lib

      - name: Verify executables
        shell: powershell
        run: |
          $original = Get-ChildItem memreduct-plus\bin -Recurse -Filter memreduct.exe | Where-Object { $_.FullName -match 'amd64|x64' } | Select-Object -First 1
          $plus = Get-Item memreduct-plus\bin\amd64\MemReductPlus.exe
          if (-not $original) { throw 'Original memreduct.exe was not produced.' }
          if ($plus.Length -lt 20000) { throw 'MemReductPlus.exe is unexpectedly small.' }
          Write-Host "Original: $($original.FullName) $($original.Length) bytes"
          Write-Host "Plus: $($plus.FullName) $($plus.Length) bytes"
          Get-FileHash $plus.FullName -Algorithm SHA256

      - name: Prepare final package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path memreduct-plus\final | Out-Null
          $original = Get-ChildItem memreduct-plus\bin -Recurse -Filter memreduct.exe | Where-Object { $_.FullName -match 'amd64|x64' } | Select-Object -First 1
          Copy-Item $original.FullName memreduct-plus\final\memreduct.exe
          Copy-Item memreduct-plus\bin\amd64\MemReductPlus.exe memreduct-plus\final\MemReductPlus.exe
          Copy-Item memreduct-plus\MEMREDUCT_PLUS.md memreduct-plus\final\MEMREDUCT_PLUS.md
          Copy-Item memreduct-plus\LICENSE memreduct-plus\final\LICENSE.txt

      - name: Upload final x64 package
        uses: actions/upload-artifact@v4
        with:
          name: memreduct-plus-final-x64
          path: memreduct-plus/final/*
          if-no-files-found: error
